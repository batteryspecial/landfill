name: e2e

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "samples/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "samples/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: "cargo test --test e2e"
